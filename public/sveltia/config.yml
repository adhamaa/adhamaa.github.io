# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.221.4/schema/sveltia-cms.json
#
# The Site's CMS. Fields here mirror the rules in src/content/load.mts: the
# build enforces what can be counted, and the hints carry the house style.

backend:
  name: github
  repo: adhamaa/adhamaa.github.io
  branch: master
  # The sveltia-cms-auth Worker on the owner's Cloudflare account, which
  # completes GitHub's OAuth flow for "Sign in with GitHub". See ADR 0003.
  base_url: https://sveltia-cms-auth.adham-92.workers.dev
  # The repository is public, so sign-in asks only for public_repo: a session
  # can never read or write the owner's private repositories.
  auth_scope: public_repo
  # `content:` is not a releasable type, so editing never cuts a release.
  commit_messages:
    create: 'content: add {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: remove {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload "{{path}}"'
    deleteMedia: 'content: delete "{{path}}"'

media_folder: /public/screenshots
public_folder: /screenshots

output:
  omit_empty_optional_fields: true

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: Pieces of work in the "Selected work" list, each with an optional Case Study.
    folder: content/projects
    extension: mdx
    format: frontmatter
    create: true
    identifier_field: name
    slug:
      template: "{{slug}}"
      editable: [create]
      hint: The Case Study's address, /work/<slug>. Set once and never changed, even if the Project is renamed.
      pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Use lowercase letters, digits and hyphens, like my-project"]
    summary: "{{order}} · {{name}}"
    sortable_fields: [order, name]
    # Case Study images get a folder per Project, named by its Slug.
    media_folder: /public/case-studies/{{filename}}
    public_folder: /case-studies/{{filename}}
    fields:
      - { name: name, label: Name, widget: string }
      - name: order
        label: Position
        widget: number
        value_type: int
        hint: Where it sits in the work list. Lowest first; the number shown on the Site comes from this.
      - name: draft
        label: Draft
        widget: boolean
        default: false
        hint: Saved but not shown anywhere on the Site. Separate from Status.
      - { name: kicker, label: Kicker, widget: string, hint: "One line: what it is, for whom." }
      - { name: problem, label: The problem, widget: text, hint: The problem it solves. }
      - { name: build, label: What I built, widget: text, hint: What I built and owned. }
      - { name: role, label: Role, widget: string, hint: "e.g. Solo — schema, API, UI, deploy" }
      - { name: year, label: Year, widget: string, hint: "e.g. 2026 — present" }
      - name: status
        label: Status
        widget: select
        options: [shipped, active, archived]
        hint: Where the product is in its life — not whether it appears on the Site.
      - name: stack
        label: Stack
        widget: list
        min: 1
        field: { name: tool, label: Tool, widget: string }
      - name: highlights
        label: Highlights
        widget: list
        min: 2
        max: 4
        hint: Two or three things worth pointing at in an interview (four at most).
        field: { name: highlight, label: Highlight, widget: text }
      - name: image
        label: Screenshot
        widget: image
        required: false
        media_folder: /public/screenshots
        public_folder: /screenshots
        hint: Must be 1344×614 WebP, from demo data only — the build rejects any other size.
      - { name: imageAlt, label: Screenshot description, widget: string, required: false, hint: What the screenshot shows, for screen readers. }
      - { name: live, label: Live link, widget: string, required: false }
      - { name: repo, label: Source link, widget: string, required: false }
      - name: caseStudyDraft
        label: Case Study is a Draft
        widget: boolean
        default: false
        hint: Keeps the Case Study below off the Site while you finish it.
      - name: body
        label: Case Study
        widget: markdown
        required: false
        hint: Optional long-form write-up, read at /work/<slug>. Images over 500 KB fail the build.

  - name: about
    label: About me
    files:
      - name: profile
        label: Profile
        file: content/profile.yml
        fields:
          - { name: name, label: Name, widget: string }
          - { name: shortName, label: Short name, widget: string }
          - { name: handle, label: Handle, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: focus, label: Focus, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: timezone, label: Time zone, widget: string }
          - { name: available, label: Available for work, widget: boolean }
          - { name: availableLabel, label: Availability line, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: phone, label: Phone, widget: string }
          - { name: siteUrl, label: Site URL, widget: string }
          - { name: resumeUrl, label: Résumé link, widget: string }
          - { name: coverLetterUrl, label: Cover letter link, widget: string }
          - name: tagline
            label: Tagline
            widget: text
            hint: Keep any platform count in step with your Projects.
          - name: stats
            label: Stats
            widget: list
            hint: Three facts above the fold. Keep the platform count in step with your Projects.
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
          - name: bio
            label: Bio
            widget: list
            hint: One paragraph per item. Keep the platform count in step with your Projects.
            field: { name: paragraph, label: Paragraph, widget: text }
          - name: capabilities
            label: What I can take on
            widget: list
            field: { name: capability, label: Capability, widget: string }
          - name: now
            label: Now
            widget: list
            field: { name: item, label: Item, widget: string }
          - name: principles
            label: Principles
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
      - name: roles
        label: Roles
        file: content/roles.yml
        fields:
          - name: roles
            label: Roles
            label_singular: Role
            widget: list
            hint: Most relevant first. Drag to reorder.
            summary: "{{title}} · {{company}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: location, label: Location, widget: string }
              - { name: period, label: Period, widget: string, hint: "e.g. Sep 2026 — present" }
              - { name: summary, label: Summary, widget: text, hint: One line on what the job actually was. }
              - name: points
                label: Points
                widget: list
                field: { name: point, label: Point, widget: text }
              - name: stack
                label: Stack
                widget: list
                field: { name: tool, label: Tool, widget: string }
              - { name: current, label: Current, widget: boolean, required: false, default: false }
      - name: stack
        label: Stack Groups
        file: content/stack.yml
        fields:
          - name: groups
            label: Stack Groups
            label_singular: Stack Group
            widget: list
            hint: In display order. Drag to reorder.
            summary: "{{title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: note, label: Note, widget: string }
              - name: items
                label: Tools
                widget: list
                field: { name: tool, label: Tool, widget: string }
