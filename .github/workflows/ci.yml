# Runs the smoke suite against the built static export, so a route that stops
# rendering reds the pull request instead of reaching visitors.
name: CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Smoke suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        # Next 16 removed linting from `next build`, so without this step ESLint
        # silently stops running rather than failing.
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browser
        # --with-deps also installs the system libraries Chromium needs on the
        # runner; those live outside the cached browser directory.
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the static export
        run: pnpm run build
      - name: Run the smoke suite
        run: pnpm exec playwright test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
