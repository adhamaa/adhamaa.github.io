# The whole pipeline in one place.
#
#   pull request   verify
#   push to master verify, then deploy and release in parallel
#
# `verify` builds the static export once. The same `out/` it tests is the
# artifact that deploys, so there is no second build and nothing deployed that
# was not tested.
name: CI/CD

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

# Pull requests cancel their own superseded runs. Runs on master never cancel
# a deploy half-way; a newer push simply queues behind it.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        # Next 16 removed linting from `next build`, so without this step ESLint
        # silently stops running rather than failing.
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build the static export
        run: pnpm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser
        # --with-deps also installs the system libraries Chromium needs on the
        # runner; those live outside the cached browser directory.
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the smoke suite
        run: pnpm exec playwright test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Package the tested export for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Releases cut themselves. release-please opens (or updates) a release PR from
  # the conventional commits since the last tag; this job merges it straight
  # away and then publishes the tag and GitHub release.
  #
  # The merge is made with the workflow token, and pushes made with that token
  # do not start new workflow runs. That is deliberate: the release commit only
  # bumps the version and the changelog, so it triggers no second build, test
  # run or deploy.
  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Open or update the release PR
        id: prepare
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge the release PR
        if: steps.prepare.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ fromJSON(steps.prepare.outputs.pr).number }}
        run: |
          # GitHub computes mergeability asynchronously after a PR is created.
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash && exit 0
            sleep 5
          done
          echo "Release PR #$PR did not become mergeable." >&2
          exit 1
      - name: Tag and publish the release
        if: steps.prepare.outputs.prs_created == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
